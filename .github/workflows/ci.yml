name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/gui/web/package-lock.json

      - name: Install GUI dependencies
        run: npm --prefix internal/gui/web ci

      - name: Test GUI
        run: npm --prefix internal/gui/web run test

      - name: Build GUI
        run: npm --prefix internal/gui/web run build

      - name: Verify embedded GUI build output
        run: |
          test -s internal/gui/web/dist/index.html
          grep -q 'assets/index-.*\.css' internal/gui/web/dist/index.html
          grep -q 'assets/index-.*\.js' internal/gui/web/dist/index.html
          find internal/gui/web/dist/assets -type f -name '*.css' -size +0c
          find internal/gui/web/dist/assets -type f -name '*.js' -size +0c

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o "$RUNNER_TEMP/agentbox" ./cmd/agentbox

      - name: Validate GoReleaser configuration
        if: matrix.os == 'ubuntu-latest'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
