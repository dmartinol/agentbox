title: AgentBox
description: A local CLI and web GUI for running coding agents in isolated OpenShell sandboxes.
url: https://dmartinol.github.io
baseurl: /agentbox
theme: minima
markdown: kramdown
permalink: pretty

collections:
  cli:
    output: true
    permalink: /cli-reference/:path/

plugins:
  - jekyll-seo-tag

exclude:
  - AGENTS.md
  - IT01-REPORT.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - _site
