<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {%- include head.html -%}
  <body>
    {%- include header.html -%}

    <main class="docs-main" aria-label="Content">
      <div class="docs-shell">
        {%- include docs-nav.html -%}

        <article class="post docs-body">
          <header class="post-header">
            <h1 class="post-title">{{ page.title | escape }}</h1>
          </header>
          <div class="post-content">
            {{ content }}
          </div>
        </article>
      </div>
    </main>

    {%- include footer.html -%}
  </body>
</html>
